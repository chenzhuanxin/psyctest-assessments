<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理测评题库 · 总集成</title>
<style>
:root{
  --brand:#5b6bd6; --brand-2:#8b5cf6; --brand-3:#06b6d4;
  --bg:#f6f7fb; --g1:#eef1ff; --g2:#f7f0ff;
  --surface:#fff; --surface-2:#f9fafb; --text:#1a1d29; --text-2:#5b6170; --text-3:#9ca3af;
  --line:#e5e7eb; --line-2:#eef0f4;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --shadow-lg:0 20px 50px rgba(30,41,82,.14);
}
[data-theme="dark"]{
  --bg:#0e1016; --g1:#151a2e; --g2:#1d1630; --surface:#171a23; --surface-2:#1e222d;
  --text:#eef0f6; --text-2:#a9b0c0; --text-3:#6b7280; --line:#2a2f3c; --line-2:#232836;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(1200px 600px at 12% -8%,var(--g1),transparent 60%),
             radial-gradient(1000px 520px at 95% 2%,var(--g2),transparent 55%)}
a{color:inherit;text-decoration:none}
::selection{background:rgba(91,107,214,.22)}

header.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--surface) 84%,transparent);border-bottom:1px solid var(--line-2)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px}
.logo{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 4px 12px rgba(91,107,214,.35)}
.spacer{flex:1}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text-2);padding:6px 12px;
  border-radius:999px;font-size:12.5px;cursor:pointer;transition:.18s;font-family:inherit}
.ghost:hover{border-color:var(--brand);color:var(--brand)}

.hero{max-width:1280px;margin:26px auto 0;padding:0 22px}
.hero-card{position:relative;overflow:hidden;border-radius:26px;padding:36px 38px;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-2) 62%,var(--brand-3) 130%);box-shadow:var(--shadow-lg)}
.hero-card::after{content:"";position:absolute;right:-80px;top:-90px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero-card h1{margin:0 0 10px;font-size:31px;letter-spacing:-.5px;font-weight:800;position:relative}
.hero-card p{margin:0;font-size:14.5px;opacity:.95;max-width:760px;position:relative}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:24px;position:relative}
.stats div{font-size:12px;opacity:.88;letter-spacing:.4px}
.stats b{display:block;font-size:26px;font-weight:800;letter-spacing:-.8px}

.toolbar{max-width:1280px;margin:22px auto 0;padding:0 22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;padding:12px 16px 12px 40px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.18s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(91,107,214,.14)}
.search::before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-52%);
  font-size:19px;color:var(--text-3)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);font-size:12.5px;cursor:pointer;transition:.16s;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(91,107,214,.3)}

.wrap{max-width:1280px;margin:22px auto 60px;padding:0 22px;display:grid;grid-template-columns:214px 1fr;gap:26px;align-items:start}
nav.side{position:sticky;top:74px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
nav.side .ttl{font-size:11px;letter-spacing:1.4px;color:var(--text-3);font-weight:700;margin:6px 0 10px;text-transform:uppercase}
nav.side a{display:flex;justify-content:space-between;gap:8px;padding:8px 11px;border-radius:11px;
  font-size:13.2px;color:var(--text-2);transition:.15s;margin-bottom:2px}
nav.side a:hover{background:var(--surface-2);color:var(--text)}
nav.side a.on{background:color-mix(in srgb,var(--brand) 11%,transparent);color:var(--brand);font-weight:650}
nav.side a i{font-style:normal;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}

section.grp{margin-bottom:34px;scroll-margin-top:78px}
.grp-head{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line-2)}
.grp-head h2{margin:0;font-size:18px;font-weight:750;letter-spacing:-.2px}
.grp-head span{font-size:12.5px;color:var(--text-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px 17px;
  box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:9px;min-height:126px}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--brand) 42%,var(--line))}
.card:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.card .code{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--brand);
  background:color-mix(in srgb,var(--brand) 10%,transparent);padding:2px 7px;border-radius:6px;align-self:flex-start}
.card h3{margin:0;font-size:14.8px;font-weight:680;line-height:1.4;letter-spacing:-.15px}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-3);
  border:1px solid var(--line-2);white-space:nowrap}
.tag.s{color:#0a7a55;background:rgba(16,185,129,.12);border-color:transparent}
.tag.f{color:#96650a;background:rgba(245,158,11,.14);border-color:transparent}
.tag.k{color:#b42318;background:rgba(239,68,68,.11);border-color:transparent}
.tag.l{color:var(--brand);background:rgba(91,107,214,.1);border-color:transparent}
[data-theme="dark"] .tag.s{color:#34d399}[data-theme="dark"] .tag.f{color:#fbbf24}[data-theme="dark"] .tag.k{color:#f87171}
.card .go{font-size:12px;color:var(--text-3);transition:.18s}
.card:hover .go{color:var(--brand);transform:translateX(2px)}
.empty{text-align:center;padding:70px 20px;color:var(--text-3)}
.empty b{display:block;font-size:16px;color:var(--text-2);margin-bottom:6px}
footer{max-width:1280px;margin:0 auto;padding:26px 22px 46px;color:var(--text-3);font-size:12px;
  border-top:1px solid var(--line-2);line-height:1.9}
@media(max-width:880px){.wrap{grid-template-columns:1fr}nav.side{position:static;display:flex;gap:7px;overflow-x:auto;
  max-height:none;padding-bottom:6px}nav.side .ttl{display:none}nav.side a{white-space:nowrap;margin:0}
  .hero-card{padding:26px 22px}.hero-card h1{font-size:23px}.stats{gap:18px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="logo">✦</span><span>心理测评题库</span></div>
    <div class="spacer"></div>
    <button class="ghost" id="btn-random">🎲 随机开一个</button>
    <button class="ghost" id="btn-theme">◐ 切换主题</button>
  </div>
</header>

<div class="hero">
  <div class="hero-card">
    <h1>测评题库总集成</h1>
    <p>配置驱动的选择题测评集合。每个测评均为独立单文件页面，可离线双击打开，包含题目、选项分值、维度计分、分数段解读与改进建议；全部题目选项位置已随机化，避免位置线索。</p>
    <div class="stats" id="stats"></div>
  </div>
</div>

<div class="toolbar">
  <div class="search"><input id="q" type="search" placeholder="搜索测评名称、维度或编号…" aria-label="搜索测评"></div>
  <div class="chips" id="style-chips"></div>
</div>

<div class="wrap">
  <nav class="side" id="side"><div class="ttl">分类导航</div></nav>
  <main id="main"></main>
</div>

<footer id="foot"></footer>

const GROUPS = ["人格与个性", "恋爱与亲密关系", "婚姻与家庭", "人际与社交", "职场与事业", "心理健康", "情绪与压力管理", "认知与能力", "自我成长与人生观", "金钱与财富", "性与性别心理", "亲子儿童与青少年", "知识与趣味娱乐", "投射与潜意识", "学习力"];
const $=s=>document.querySelector(s);
const state={q:"",style:"",group:""};
const styleClass={"情景选择":"l","频率自评":"f","知识问答":"k","轻松趣味":"s"};

function stats(){
  const nq=MANIFEST.reduce((a,x)=>a+x.nq,0), nd=MANIFEST.reduce((a,x)=>a+x.ndim,0);
  $("#stats").innerHTML=`<div><b>${MANIFEST.length}</b>个测评主题</div>
    <div><b>${nq.toLocaleString()}</b>道选择题</div>
    <div><b>${nd}</b>个测量维度</div>
    <div><b>${GROUPS.length}</b>个分类</div>`;
  $("#foot").innerHTML=`共 ${MANIFEST.length} 个测评 · ${nq.toLocaleString()} 题 · ${GROUPS.length} 个分类 &nbsp;|&nbsp; 生成时间 ${new Date().toLocaleString("zh-CN",{hour12:false})}<br>
    所有页面纯本地运行，作答数据不上传服务器；结果仅供自我探索与工具设计参考，不构成任何医学或心理诊断。`;
}
function match(x){
  if(state.style && x.style!==state.style) return false;
  if(state.group && x.domain!==state.group) return false;
  if(!state.q) return true;
  const q=state.q.toLowerCase();
  return (x.theme+" "+x.code+" "+x.domain+" "+x.dims.join(" ")+" "+x.style).toLowerCase().includes(q);
}
function card(x){
  return `<a class="card" href="web/${x.file}" title="${x.theme}">
    <span class="code">${x.code}</span><h3>${x.theme}</h3>
    <div class="meta"><span class="tag ${styleClass[x.style]||""}">${x.style}</span>
      <span class="tag">${x.nq} 题</span><span class="tag">${x.ndim} 维度</span></div>
    <div class="go">进入测评 →</div></a>`;
}
function render(){
  const list=MANIFEST.filter(match);
  if(!list.length){ $("#main").innerHTML=`<div class="empty"><b>没有匹配的测评</b>换个关键词试试，或清空筛选条件</div>`; }
  else if(state.group || state.q || state.style){
    $("#main").innerHTML=`<section class="grp"><div class="grp-head"><h2>筛选结果</h2><span>${list.length} 个测评</span></div>
      <div class="grid">${list.map(card).join("")}</div></section>`;
  }else{
    $("#main").innerHTML=GROUPS.filter(g=>list.some(x=>x.domain===g)).map(g=>{
      const items=list.filter(x=>x.domain===g);
      return `<section class="grp" id="g-${encodeURIComponent(g)}"><div class="grp-head"><h2>${g}</h2>
        <span>${items.length} 个测评 · ${items.reduce((a,x)=>a+x.nq,0)} 题</span></div>
        <div class="grid">${items.map(card).join("")}</div></section>`;}).join("");
  }
  document.querySelectorAll("nav.side a").forEach(a=>a.classList.toggle("on", a.dataset.g===state.group));
}
function chips(){
  const styles=[...new Set(MANIFEST.map(x=>x.style))];
  $("#style-chips").innerHTML=[{v:"",t:"全部风格"}].concat(styles.map(s=>({v:s,t:s})))
    .map(o=>`<button class="chip ${state.style===o.v?"on":""}" data-s="${o.v}">${o.t}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.style=b.dataset.s;chips();render();});
}
function side(){
  $("#side").innerHTML=`<div class="ttl">分类导航</div>
    <a href="#" data-g="" class="${state.group?"":"on"}">全部<span>${MANIFEST.length}</span></a>`+
    GROUPS.map(g=>{const n=MANIFEST.filter(x=>x.domain===g).length;
      return `<a href="#g-${encodeURIComponent(g)}" data-g="${g}">${g}<i>${n}</i></a>`;}).join("");
  document.querySelectorAll("nav.side a").forEach(a=>{
    a.onclick=e=>{ state.group=a.dataset.g; if(!state.group) e.preventDefault();
      chips(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
}
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
$("#btn-random").onclick=()=>{const x=MANIFEST[Math.floor(Math.random()*MANIFEST.length)];
  location.href="web/"+x.file;};
$("#btn-theme").onclick=()=>{const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";};

stats(); side(); chips(); render();
if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)
  document.documentElement.dataset.theme="dark";
</script>
